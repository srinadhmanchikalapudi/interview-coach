name: CI

# Builds and tests every push to main and every pull request. (A WPF app, so it runs on Windows.)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build InterviewCoach.sln -c Release --nologo

      - name: Test
        run: dotnet test InterviewCoach.sln -c Release --no-build --nologo
